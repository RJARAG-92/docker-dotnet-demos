services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo02-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=demo02;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: demo02-db
    environment:
      POSTGRES_DB: demo02
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - demo02_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo02"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  demo02_pgdata:
